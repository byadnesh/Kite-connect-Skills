<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Kite Skills — unofficial agent skills for Zerodha Kite Connect">
  <title>Kite Skills — unofficial agent skills for Zerodha Kite Connect</title>
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#F6461A"/>
      <stop offset="0.45" stop-color="#FF7A45"/>
      <stop offset="0.55" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#DA3530"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="typing"><rect class="type" x="300" y="138" width="580" height="34"/></clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .sub { fill: #6E7781; font-size: 21px; }
    .pill-text { fill: #DA3530; font-size: 13px; font-weight: 700; letter-spacing: 2px; }

    .logo  { animation: float 5s ease-in-out 1.6s infinite; }
    .wing  { animation: slide 0.9s cubic-bezier(.2,.8,.2,1) both; }
    .tail  { animation: drop 0.7s cubic-bezier(.2,.8,.2,1) 0.6s both; }
    .title { animation: rise 0.8s ease-out 0.5s both; }
    .type  { transform-box: fill-box; transform-origin: left center; animation: type 2.2s steps(46, end) 1.1s both; }
    .pill  { animation: rise 0.6s ease-out 3.2s both, glow 2.8s ease-in-out 4s infinite; }

    @keyframes slide { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes drop  { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise  { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes type  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes glow  { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g class="logo">
    <g transform="translate(40 48) scale(0.4)">
      <g transform="translate(-30 -120)">
        <polygon class="wing" points="30,300 210,120 570,120 210,480" fill="#F6461A"/>
        <polygon class="tail" points="390,300 570,480 210,480" fill="#DA3530"/>
      </g>
    </g>
  </g>

  <text class="title" x="300" y="118" font-size="68" font-weight="800" fill="url(#title)">Kite Skills</text>
  <text class="sub" x="302" y="162" clip-path="url(#typing)">Agent skills for Zerodha Kite Connect · NSE · BSE · NFO · MCX</text>

  <g class="pill">
    <rect x="302" y="184" width="292" height="30" rx="15" fill="none" stroke="#DA3530" stroke-width="1.5"/>
    <text class="pill-text" x="448" y="204" text-anchor="middle">UNOFFICIAL · COMMUNITY PROJECT</text>
  </g>
</svg>
