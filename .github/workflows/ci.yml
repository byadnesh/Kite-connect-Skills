name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Byte-compile all scripts
        run: python -m compileall -q skills tests
      - name: SDK import smoke test
        run: |
          python -m pip install --quiet kiteconnect
          python -c "from kiteconnect import KiteConnect, KiteTicker; k = KiteConnect(api_key='x'); assert k.MARKET_PROTECTION_AUTO == -1 and hasattr(k, 'place_autoslice_order')"

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node bin/install.js --help
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
